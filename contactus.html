<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2><b>Contact Us</b></h2>

        <form action="/submit_contact" method="post">
           <label for="fullname"><b>Full Name:</b></label><br>
           <input type="text" id="fullname" name="fullname" placeholder="enter your full name" required maxlength="50"><br>

           <label for="email"><b>Email:</b></label><br>
           <input type="text" id="email" name="email" placeholder="enter your email address" required maxlength="50"><br>

           <label for="phone number"><b>Phone Number:</b></label><br>
           <input type="text" id="phone number" name="phone number" placeholder="1234567890" required maxlength="15"><br>

           <label for="message"><b>Message:</b></label><br>
           <textarea name="Message" id="Message" placeholder="write your message here..." rows="5" required maxlength="500"></textarea><br>
           
           <button type="submit">Submit</button><br>

           <footer>&copy; 2024 Your Company Name. All rights reserved.</footer>

        </form>
    </div>

</html>
